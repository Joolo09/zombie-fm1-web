<body><header><div class="brand"><span class="sigil">Z</span><div><strong>ZOMBIE CORE</strong><small>SAMPLER / 0.8.0</small></div></div><div class="top-controls"><a href="../../" data-i="webInstall"></a><span id="connection" class="pill"></span><button id="connect" data-i="connect"></button><button id="audio" data-i="audio"></button><select id="language" aria-label="Язык / Language"><option value="ru">Русский</option><option value="en">English</option></select></div></header>

<section id="ports" class="card" hidden><h2 data-i="midiPorts"></h2><div class="row"><label><span data-i="input"></span><select id="midi-in"></select></label><label><span data-i="output"></span><select id="midi-out"></select></label><button id="port-connect" class="accent" data-i="openDevice"></button><button id="port-cancel" data-i="cancel"></button></div><p class="muted" data-i="midiHelp"></p></section>
<section class="transport card"><button id="play" class="accent" data-i="play"></button><button id="stop" data-i="stop"></button><button id="record" data-i="record" aria-pressed="false"></button><label>BPM <input id="tempo" type="number" min="30" max="300" value="120"></label><button id="tap-tempo" data-i="tap"></button><details id="clock-details"><summary data-i="timing"></summary><div class="timing-popover"><label><span data-i="swing"></span><input id="swing" type="range" min="0" max="60" value="0"><output id="swing-value">0</output></label><label><span data-i="clock"></span><select id="clock"><option value="0" data-i="internal"></option><option value="1">USB / TRS MIDI</option></select></label></div></details><div class="position-display" id="position-display">01 : 01</div><button id="undo" data-i="undo" disabled></button><button id="redo" data-i="redo" disabled></button><span class="grow"></span><button id="save-device" data-i="saveDevice" disabled></button></section>

<nav class="tabs"><button data-tab="live" data-i="live"></button><button data-tab="sound" data-i="sound" aria-selected="true"></button><button data-tab="sequence" data-i="sequence"></button><button data-tab="mixer" data-i="mixer"></button><button data-tab="samples" data-i="samples"></button><button data-tab="projects" data-i="projects"></button><button data-tab="settings" data-i="settings"></button></nav>
<section id="sound" class="panel"><div class="sound-header card"><div><p class="eyebrow" data-i="instrument"></p><h2 id="instrument-name">ANALOG</h2></div><label><span data-i="model"></span><select id="model"></select></label><label class="grow"><span data-i="preset"></span><input id="preset-search" type="search" aria-label="Поиск пресета / Search presets" placeholder="Поиск / Search"><select id="preset"></select></label><button id="load-preset" data-i="loadPreset"></button></div><div class="sound-grid"><div class="card"><h2 data-i="oscillator"></h2><div id="osc-controls" class="controls"></div></div><div class="card"><h2 data-i="filter"></h2><canvas id="filter-graph" width="440" height="100"></canvas><div id="filter-controls" class="controls"></div></div><div class="card"><h2 data-i="envelope"></h2><canvas id="envelope-graph" width="440" height="100"></canvas><div id="env-controls" class="controls"></div></div><div class="card"><h2 data-i="effects"></h2><div id="fx-controls" class="controls"></div></div></div></section>
<section id="live" class="panel card" hidden><div class="row"><h2 data-i="live"></h2><span class="grow"></span><label><span data-i="fxAmount"></span><input id="fx-amount" type="range" min="0" max="127" value="90"></label><label><span data-i="fxRate"></span><select id="fx-rate"><option value="0">1/4</option><option value="1">1/8</option><option value="2">1/16</option><option value="3">1/32</option></select></label></div><div id="live-tracks" class="live-tracks"></div><div id="live-pads"></div><p class="muted" data-i="liveHelp"></p></section>
<section id="sequence" class="panel card" hidden><div class="row"><h2 data-i="sequence"></h2><span class="grow"></span><label><span data-i="length"></span><input id="length" type="number" min="1" max="64"></label><button id="duplicate-pattern" data-i="duplicate"></button><button id="shift-left" data-i="shiftLeft"></button><button id="shift-right" data-i="shiftRight"></button><button id="reverse-pattern" data-i="reverse"></button><button id="random-pattern" data-i="generate"></button><button id="clear-pattern" data-i="clear"></button></div><div class="row record-setup"><label><span data-i="recMode"></span><select id="rec-mode"><option value="0">OVERDUB</option><option value="1">REPLACE</option></select></label><label><span data-i="recQuant"></span><select id="rec-quant"><option value="0">NEAREST</option><option value="1">FLOOR</option></select></label><label><span data-i="metronome"></span><select id="metronome"><option value="0">OFF</option><option value="1">ON</option></select></label></div><p class="muted" data-i="recordHelp"></p><div id="seq-controls" class="controls"></div><div id="banks" class="row"></div><div id="step-grid"></div><div class="pattern-actions row"><label><span data-i="copyTo"></span><select id="copy-target"></select></label><button id="copy-pattern" data-i="copyPattern"></button><button id="toggle-step" data-i="toggleStep" aria-pressed="false"></button></div><div id="step-edit" class="row"></div><p class="muted" data-i="seqHelp"></p><h3 data-i="arpeggiator"></h3><div id="arp-controls" class="controls"></div></section>
<section id="mixer" class="panel card" hidden><h2 data-i="mixer"></h2><div id="mixer-strips"></div></section>
<section id="samples" class="panel card" hidden><div class="pad-workstation"><div class="row"><div><p class="eyebrow">ZOMBIE PAD SAMPLER / 32 PADS</p><h2 id="sampler-title"></h2></div><span class="grow"></span><button id="sampler-enable" class="accent" aria-pressed="false"></button></div><p id="sampler-help" class="muted"></p><div class="sampler-layout"><div><div class="row pad-banks"><button id="pad-bank-0" aria-pressed="true">BANK A</button><button id="pad-bank-1" aria-pressed="false">BANK B</button></div><div id="sampler-pads"></div></div><div class="pad-editor"><div class="row"><h3 id="pad-name"></h3><span class="grow"></span><button id="pad-chop-4">CHOP 4</button><button id="pad-chop-8">CHOP 8</button><button id="pad-chop-16">CHOP 16</button></div><canvas id="pad-wave" width="640" height="120"></canvas><p id="pad-duration" class="muted"></p><div id="pad-fields"></div></div></div><div class="row pad-map-actions"><button id="sampler-save" disabled></button><button id="sampler-export"></button><label class="file-button"><span id="sampler-import-label"></span><input id="sampler-import" type="file" accept=".json,application/json"></label></div><p id="sampler-map-note" class="muted"></p></div><p class="eyebrow">PCM SAMPLER</p><h2 data-i="yourSounds"></h2><p class="muted" data-i="sampleHelp"></p><div class="row"><label><span data-i="slot"></span><select id="sample-slot"><option value="0">USR1</option><option value="1">USR2</option><option value="2">USR3</option><option value="3">USR4</option></select></label><label><span data-i="sampleRate"></span><select id="sample-rate"><option>8000</option><option>11025</option><option selected>22050</option><option>44100</option></select></label><label class="file-button"><span data-i="openWav"></span><input id="wav-file" type="file" accept=".wav,audio/wav"></label></div><canvas id="waveform" width="1100" height="150"></canvas><p id="sample-info" class="muted"></p><div class="row"><label><span data-i="trimStart"></span><input id="trim-start" type="number" min="0" step="0.01" value="0"></label><label><span data-i="trimEnd"></span><input id="trim-end" type="number" min="0.01" step="0.01" value="1"></label><button id="sample-preview" data-i="listen" disabled></button><button id="sample-upload" class="accent" data-i="sendSample" disabled></button><progress id="sample-progress" max="1" value="0"></progress></div><p class="muted" data-i="sampleNotice"></p><div id="slot-status" class="row"></div></section>
<section id="projects" class="panel card" hidden><h2 data-i="projects"></h2><p class="muted" data-i="projectHelp"></p><div class="row"><button id="export-project" class="accent" data-i="exportProject"></button><label class="file-button"><span data-i="importProject"></span><input id="import-project" type="file" accept=".json,application/json"></label><button id="export-patch" data-i="exportPatch"></button><label class="file-button"><span data-i="importPatch"></span><input id="import-patch" type="file" accept=".json,application/json"></label></div></section>
<section id="settings" class="panel card" hidden><h2 data-i="settings"></h2><div class="row"><label><span data-i="theme"></span><select id="theme"><option value="afterglow">Afterglow</option><option value="crypt">Crypt</option><option value="neon">Neon</option><option value="paper">Paper</option></select></label><label><span data-i="previewVolume"></span><input id="preview-volume" type="range" min="0" max="100" value="70"></label></div><div id="system-settings" class="system-grid"><article class="system-block profile-block"><div><p class="eyebrow">USB MIDI / FL STUDIO + ABLETON</p><h3 data-sys-ru="Режим MIDI" data-sys-en="MIDI mode"></h3><p class="muted" data-sys-ru="При запуске — Standalone. Режим DAW можно включить вручную. Для Ableton Live есть отдельный профиль Zombie_Core_FM1. K1–K4: CC74/71/73/72. SELECT: громкость; PRESET: панорама; ALGO: дорожки Live 1–6 или каналы FL Channel Rack 1–6. Для четырёх макросов используй MIDI Learn / Multilink в FL." data-sys-en="Starts in Standalone. Switch to DAW mode manually. Ableton Live uses the separate Zombie_Core_FM1 profile. K1–K4: CC74/71/73/72. SELECT: volume; PRESET: pan; ALGO: Live tracks 1–6 or FL Channel Rack channels 1–6. Link the four macros with FL MIDI Learn / Multilink."></p></div><div class="system-fields"><label><span data-sys-ru="Режим устройства" data-sys-en="Device mode"></span><select id="sys-midiMode"><option value="2">DAW Controller</option><option value="1">DAW Synth / Local OFF</option><option value="0">Standalone / Local ON</option></select></label><label><span data-sys-ru="PLAY / REC → DAW" data-sys-en="PLAY / REC → DAW"></span><select id="sys-transport"><option value="1" data-sys-ru="Включён" data-sys-en="On"></option><option value="0" data-sys-ru="Выключен" data-sys-en="Off"></option></select></label><small class="muted" data-sys-ru="Нужна прошивка 0.7.4 и профиль Zombie Core FM-1. Перед запуском FL или Live отключи MIDI в редакторе. Настройки сохраняются кнопкой «Сохранить систему»." data-sys-en="Requires firmware 0.7.4 and the Zombie Core FM-1 script. Disconnect editor MIDI before starting FL or Live. Other system settings are saved; each startup selects Standalone."></small></div></article>
<article class="system-block"><p class="eyebrow">FM-1 / SYSTEM</p><h3 data-sys-ru="Системные настройки" data-sys-en="System settings"></h3><div class="system-fields">
<label><span data-sys-ru="Уровень выхода" data-sys-en="Output level"></span><div class="row"><input id="sys-trim" type="range" min="0" max="127" value="100"><output id="sys-trim-value">100%</output></div></label>
<label><span data-sys-ru="Мягкий лимитер" data-sys-en="Soft limiter"></span><select id="sys-limiter"><option value="1" data-sys-ru="Включён" data-sys-en="On"></option><option value="0" data-sys-ru="Выключен" data-sys-en="Off"></option></select></label>
<label><span data-sys-ru="Подсветка клавиш" data-sys-en="Key glow"></span><select id="sys-glow"><option value="0" data-sys-ru="Выкл." data-sys-en="Off"></option><option value="1" data-sys-ru="При игре" data-sys-en="While playing"></option><option value="2" data-sys-ru="Все клавиши" data-sys-en="All keys"></option></select></label>
<label><span data-sys-ru="Чувствительность" data-sys-en="Velocity curve"></span><select id="sys-velocity"><option value="0" data-sys-ru="Обычная" data-sys-en="Normal"></option><option value="1" data-sys-ru="Лёгкое нажатие" data-sys-en="Light touch"></option><option value="2" data-sys-ru="Фиксированная: 100" data-sys-en="Fixed: 100"></option></select></label>
<label><span data-sys-ru="Экран при запуске" data-sys-en="Startup page"></span><select id="sys-start"><option value="0">HOME</option><option value="1">SEQ</option><option value="2">SEL / MIXER</option></select></label></div></article>
<article class="system-block"><p class="eyebrow">CPU / EXPERIMENTAL</p><h3 data-sys-ru="Второе ядро" data-sys-en="Second core"></h3><strong id="sys-core-status" class="core-state">CPU0</strong><label><span data-sys-ru="Обработка выхода" data-sys-en="Output processing"></span><select id="sys-dual"><option value="0">CPU0</option><option value="1">CPU1</option></select></label><p class="muted" data-sys-ru="CPU1: уровень, лимитер, преобразование аудио и измерение пика. Синтез остаётся на CPU0. Включение остановит воспроизведение и проверит результат; при ошибке — возврат на CPU0." data-sys-en="CPU1: gain, limiter, audio conversion and peak metering. Synthesis stays on CPU0. Enabling stops playback and runs a self-test; errors fall back to CPU0."></p><p class="muted" data-sys-ru="Экспериментально, на физическом FM-1 пока не проверено. После перезапуска CPU1 выключен." data-sys-en="Experimental, not yet verified on physical FM-1. CPU1 starts disabled after every reboot."></p><small id="sys-diagnostics"></small></article>
<article class="system-block profile-block"><div><p class="eyebrow">HOME / PROFILE</p><h3 data-sys-ru="Обо мне" data-sys-en="About me"></h3><p class="muted" data-sys-ru="Удерживай HOME и поверни PRESET: профиль на экране FM-1. Имя и подпись хранятся в устройстве." data-sys-en="Hold HOME and turn PRESET to view your profile on FM-1. Your name and signature are stored on the device."></p></div><div class="system-fields"><label><span data-sys-ru="Имя / ник" data-sys-en="Name / nickname"></span><input id="sys-name" type="text" maxlength="31" autocomplete="off"></label><label><span data-sys-ru="Подпись" data-sys-en="Signature"></span><input id="sys-bio" type="text" maxlength="63" autocomplete="off"></label><small class="muted" data-sys-ru="Русский и латиница. Имя: 31 байт; подпись: 63 байта. Русская буква занимает 2 байта." data-sys-en="ASCII and Cyrillic. Name: 31 bytes; signature: 63 bytes. A Cyrillic letter uses 2 bytes."></small></div></article>
<div class="system-save row"><p id="sys-message" role="status" class="muted grow"></p><button id="sys-save" class="accent" data-sys-ru="Сохранить систему" data-sys-en="Save system" disabled></button></div></div><h3>MIDI / FL Studio</h3><p data-i="flHelp"></p><div id="midi-channels" class="controls"></div><h3>FM-1 / HOLD</h3><p data-i="holdHelp"></p><h3 data-i="about"></h3><p data-i="aboutText"></p><p class="muted" data-i="alpha"></p><p><a href="https://github.com/illuminus5/skiff" target="_blank" rel="noopener">Skiff</a> · <a href="https://github.com/isod89/sloop-fm1" target="_blank" rel="noopener">SLOOP</a> · <a href="https://github.com/charlesvestal/fm1-base" target="_blank" rel="noopener">fm1-base</a></p></section>
<section class="keyboard card"><div class="row"><small data-i="keyboard"></small><span class="grow"></span><button id="oct-down">− OCT</button><span id="octave">C4</span><button id="oct-up">+ OCT</button><button id="panic" data-i="panic"></button></div><div id="keys"></div></section>
<div id="status" role="status" aria-live="polite"></div><footer><span data-i="footer"></span><span>44.1 kHz · 6 TRACKS · 8 VOICES · PAD SAMPLER</span></footer></main><script type="module" src="app.js"></script></body></html>
